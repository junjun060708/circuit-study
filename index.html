</style></head><body><a class="skip" href="#lesson-title">跳到课程内容</a><header class="topbar"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12 H15 M25 12 H35 V30 H5 V12"/><rect x="15" y="7" width="10" height="10"/><circle cx="12" cy="30" r="3" fill="white"/><circle cx="29" cy="30" r="3" fill="white"/></g></svg><div>电路自习室<small>断网也能继续的电路课</small></div></div><button class="mobile-menu" data-action="menu" aria-controls="sidebar">课程目录</button><div class="tools"><button class="tool" data-action="records">学习记录</button><button class="tool optional" data-action="record-export">导出笔记</button><button class="tool" data-action="export">导出进度</button><button class="tool" data-action="import" title="用导出的JSON替换当前本机记录">导入进度</button><button class="tool optional" data-action="book">完整讲义</button></div></header><div id="storage-warning" class="storage-warning hidden" role="status">此浏览器无法持久保存本地进度。课程仍可正常使用，请在结束前点击“导出进度”，下次导入。</div><div class="layout"><aside class="sidebar" id="sidebar" aria-label="课程目录"><button class="mobile-menu" data-action="menu">收起目录</button><div class="course-summary" id="course-summary"></div><nav id="course-list"></nav><div class="sidebar-foot">每天约三讲，按理解进度调整。<br>每讲先思考，最后用综合例题收尾。<br><button class="quiet" data-action="record-export">导出笔记与作答记录</button><br><button class="quiet" data-action="book">下载完整可打印讲义</button><br><button class="quiet" data-action="print">打印本讲（含解析）</button></div></aside><main class="main" id="main"><div class="reading"><header class="lesson-heading" id="lesson-heading"></header><nav class="stages" id="stages" aria-label="本讲学习流程"></nav><div id="lesson-body"></div><footer class="lesson-footer" id="lesson-footer"></footer></div></main></div><dialog id="records-dialog"><div class="dialog-head"><h2>学习记录与待复习</h2><button class="secondary" data-action="close-records">关闭</button></div><div class="dialog-body" id="records-body"></div><button class="primary" data-action="record-export">导出为学习记录</button></dialog><input type="file" class="hidden" id="import-file" accept=".json,application/json"><div class="toast hidden" id="toast" role="status" aria-live="polite"></div><div class="print-area" id="print-area"></div><noscript><p style="padding:30px">互动学习需要浏览器启用JavaScript。你也可以直接打开随包的“电路核心课程讲义.html”阅读全部内容。</p></noscript><script>const DATA={"version":1,"date":"2026-10-30","title":"电路自习室","lessons":[{"id":"1","title":"参考方向与功率","group":"直流分析","minutes":"45–60","prior":"已学一轮，可复习","prereq":"会做基本乘除，认识电压、电流的单位。","goals":["区分参考方向与真实方向","根据电压、电流参考关系判断吸收或发出功率","算完能检查单位和功率平衡"],"guides":["电流算出负数，是不是电路出了问题？","同一个电源能不能有时供电、有时吸收能量？","为什么同样的 u、i，有时功率用 ui，有时用 −ui？"],"sections":[{"title":"先约定，再计算","body":"\u003cp>电流是电荷流动的快慢，单位是安培 A；电压是两点之间的电位差，单位是伏特 V。分析前先画电流箭头，标电压的正负端。这些标记是我们选择的参考方向，不会强迫实际电流按它流。\u003c/p>\u003cp>规定电流向右为正，算得 i=−2 A，表示真实电流向左、大小为 2 A。不要去掉负号后继续代入原方程；如果改箭头，就要同时改变这个变量的符号。\u003c/p>\u003cdiv class=\"equation\">U\u003csub>ab\u003c/sub> = V\u003csub>a\u003c/sub> − V\u003csub>b\u003c/sub>；U\u003csub>ba\u003c/sub> = −U\u003csub>ab\u003c/sub>\u003c/div>","q":{"id":"c1-1","type":"choice","prompt":"规定电流向下为正，结果为 −0.5 A。实际方向是？","options":["向上，大小0.5 A","向下，大小0.5 A","没有电流"],"answer":0,"explain":"负号只说明实际方向与参考方向相反。","hints":["先保留原参考箭头，再解释负号。"],"tag":"参考方向"},"diagram":null,"widget":null},{"title":"功率要连着参考关系一起看","body":"\u003cp>功率描述能量交换的快慢，单位 W。在吸收功率的约定中，电流参考箭头进入电压标“+”的一端，称关联参考方向，此时 p=ui。若电流箭头从“+”端流出，吸收功率就写 p=−ui。\u003c/p>\u003cp>判断顺序固定为：看箭头与正端的关系 → 选表达式 → 代入带符号的数值。算得吸收功率 p&gt;0，元件吸收能量；p&lt;0，元件向外供能。电源充电、放电时可能呈现不同的能量方向。\u003c/p>\u003cdiv class=\"equation\">关联：p\u003csub>吸收\u003c/sub> = ui　　非关联：p\u003csub>吸收\u003c/sub> = −ui\u003c/div>","q":{"id":"c1-2","type":"number","prompt":"某元件 u=6 V，i=2 A，电流从电压正端流出。吸收功率是多少？","value":-12,"unit":"W","explain":"电流从正端流出，用 p吸收=−ui=−6×2=−12 W，表示发出12 W。","hints":["先判断是否进入正端。","这里 p吸收=−ui。"],"tag":"功率符号"},"diagram":"power","widget":null},{"title":"电阻：算式可以交叉检查","body":"\u003cp>理想电阻把电能转成热。关联参考方向下 u=Ri，所以 p=ui=i²R=u²/R。R&gt;0 时消耗功率非负。这里的平方式适用于电阻，不是任意元件都能用 u²/R。\u003c/p>\u003cp>例如 4 Ω 电阻通过 2 A 电流，压降为 8 V，耗散 16 W。若只改变参考箭头，变量的符号会相应变化，真实发热不会改变。\u003c/p>\u003cdiv class=\"equation\">p\u003csub>R\u003c/sub> = i²R = u²/R ≥ 0\u003c/div>","q":{"id":"c1-3","type":"number","prompt":"4 Ω电阻通过2 A电流，消耗功率是多少？","value":16,"unit":"W","explain":"p=i²R=2²×4=16 W。","hints":["电流要平方。"],"tag":"电阻功率"},"diagram":null,"widget":null},{"title":"用单位和能量守恒收尾","body":"\u003cp>Ω×A=V，V×A=W。写出单位能发现把电流写成电压、把 u/R 写成 R/u 这类错误。在理想集中参数电路模型中，所有元件按吸收为正计算，瞬时功率的代数和为零。\u003c/p>\u003cp>功率平衡不代表每个元件都吸收相同功率，而是某些元件送出的总功率，等于其他元件当时吸收的总功率。电容、电感的吸收可能表现为储能。\u003c/p>","q":{"id":"c1-4","type":"choice","prompt":"把电路中所有元件按吸收功率为正相加，理想模型的结果应为？","options":["0 W","总电源电压","每个电阻功率都相等"],"answer":0,"explain":"电路满足能量守恒，发出的功率与吸收的功率平衡。","hints":[],"tag":"功率平衡"},"diagram":null,"widget":null}],"finale":{"intro":"一个12 V理想电压源与R₁=2 Ω、R₂=4 Ω串联。规定回路电流从电源正端流出，电阻电压按电流流入端为正。求电流、各电阻电压及功率，并检查平衡。","diagram":"series12","parts":[{"id":"c1-f1","type":"number","prompt":"回路电流 i","value":2,"unit":"A","explain":"串联总电阻为6 Ω，i=12/6=2 A。","hints":["先求串联总电阻。"],"tag":"计算与单位"},{"id":"c1-f2","type":"number","prompt":"R₁两端电压","value":4,"unit":"V","explain":"U₁=iR₁=2×2=4 V。","hints":[],"tag":"计算与单位"},{"id":"c1-f3","type":"number","prompt":"R₂消耗功率","value":16,"unit":"W","explain":"P₂=i²R₂=4×4=16 W。","hints":[],"tag":"计算与单位"},{"id":"c1-f4","type":"number","prompt":"电源的吸收功率","value":-24,"unit":"W","explain":"电流从电源正端流出，p源=−12×2=−24 W。","hints":["电源采用吸收为正的功率记法。"],"tag":"功率符号"}],"solution":["总电阻2+4=6 Ω，i=2 A；电阻压降分别4 V、8 V，满足12−4−8=0。","P₁=2²×2=8 W，P₂=2²×4=16 W，电源吸收功率−24 W。","功率和−24+8+16=0，单位、KVL和能量三个检查相互吻合。"],"takeaways":["负号需要连着参考方向解释。","功率公式先看参考关系，不能只看元件名字。"]}},{"id":"2","title":"元件模型与 KCL / KVL","group":"直流分析","minutes":"50–70","prior":"已学一轮，可复习","prereq":"参考方向、欧姆定律和功率的基本意义。","goals":["按节点写电流守恒","按回路写电压关系","认识独立源、受控源与模型适用范围"],"guides":["节点处的电流会不会凭空消失？","绕电路一圈，为什么电压变化要合起来为零？","理想电压源是不是任何时候电流都固定？"],"sections":[{"title":"三个基本模型分别约束什么","body":"\u003cp>电阻的关联电压电流满足 u=Ri。理想电压源固定两端电压，电流由外部电路决定；理想电流源固定支路电流，两端电压由外部电路决定。理想模型没有真实器件的功率、耐压等限制，实际选型还要查资料。\u003c/p>\u003cdiv class=\"equation\">电阻：u=Ri；电压源：u=U\u003csub>s\u003c/sub>；电流源：i=I\u003csub>s\u003c/sub>\u003c/div>\u003cp>短路要求两端电压为零，开路要求支路电流为零。短路电流不必为零，开路电压也不必为零。\u003c/p>","q":{"id":"c2-1","type":"choice","prompt":"理想12 V电压源接不同电阻时，固定的是？","options":["两端电压","支路电流","输出功率"],"answer":0,"explain":"电压源约束电压；负载改变时电流、功率可以改变。","hints":[],"tag":"源模型"},"diagram":null,"widget":null},{"title":"节点处写 KCL","body":"\u003cp>理想导线直接相连的点属于同一节点，即使导线拐弯很长，也不能多算节点。基尔霍夫电流定律KCL来自电荷守恒：流入节点的电流总和等于流出总和。\u003c/p>\u003cp>例如流入为3 A，流出有1 A和未知i，则3=1+i，得到i=2 A。也可以全部按流出为正写−3+1+i=0；两种记法一致就行。\u003c/p>\u003cdiv class=\"equation\">∑i\u003csub>流入\u003c/sub> = ∑i\u003csub>流出\u003c/sub>\u003c/div>","q":{"id":"c2-2","type":"number","prompt":"节点流入3 A，已知一支路流出1 A，另一支路流出多少？","value":2,"unit":"A","explain":"3=1+i，所以i=2 A。","hints":["先把流入、流出分别写在等号两侧。"],"tag":"KCL"},"diagram":null,"widget":null},{"title":"回路中写 KVL","body":"\u003cp>基尔霍夫电压定律KVL用于集中参数电路的电压约束。选定绕行方向，按电位升降写式。采用“电位升高为正”的记法时，经过电源从−到+写+U，经过电阻从+到−写−u。\u003c/p>\u003cp>例如12 V源驱动2 Ω和4 Ω串联，12−2i−4i=0。你也可以把全部项乘−1；不要把某一种符号记法当作唯一合法记法，关键是前后一致。\u003c/p>\u003cdiv class=\"equation\">沿闭合回路：∑电位变化 = 0\u003c/div>","q":{"id":"c2-3","type":"number","prompt":"12 V源、2 Ω和4 Ω串联，回路电流是多少？","value":2,"unit":"A","explain":"12−(2+4)i=0，i=2 A。","hints":[],"tag":"KVL"},"diagram":null,"widget":null},{"title":"受控源要同时看输出与控制量","body":"\u003cp>受控源的数值由电路中另一个电压或电流决定。先看输出是电压源还是电流源，再看等式右边由什么控制：uₒ=μuₓ是电压控制电压源；iₒ=guₓ是电压控制电流源；uₒ=riₓ是电流控制电压源；iₒ=βiₓ是电流控制电流源。\u003c/p>\u003cp>控制关系属于模型的一部分，分析和等效时不能随便删除。器件被叫作“放大器”不能代替对控制关系的判断。\u003c/p>","q":{"id":"c2-4","type":"choice","prompt":"iₒ=g·uₓ 的受控源属于？","options":["电压控制电流源","电流控制电压源","电压控制电压源"],"answer":0,"explain":"输出是电流，控制量是电压，因此是VCCS。","hints":["分别看左边输出和右边控制量。"],"tag":"受控源"},"diagram":null,"widget":null},{"title":"方程数量与结果检查","body":"\u003cp>对于连通电路，若按明确约定数出n个节点、b条支路，独立KCL方程通常取n−1个，独立KVL方程为b−n+1个。这里是在讨论连通网络拓扑，使用前要明确支路的定义。\u003c/p>\u003cp>求解后至少检查：支路电流单位为A、压降单位为V，节点电流平衡，回路电压平衡。遇到负值先解释方向，再判断是否算错。\u003c/p>","q":{"id":"c2-5","type":"number","prompt":"连通网络有4个节点，独立KCL方程可取几个？","value":3,"unit":"1","explain":"n−1=4−1=3。","hints":[],"tag":"方程数量"},"diagram":null,"widget":null}],"finale":{"intro":"12 V理想电压源经R₁=2 Ω接到节点a；a经R₂=6 Ω和R₃=3 Ω分别接地，两个电阻并联。求节点电压和支路电流，再检查KCL、KVL。","diagram":"parallel12","parts":[{"id":"c2-f1","type":"number","prompt":"节点a对地电压","value":6,"unit":"V","explain":"6 Ω与3 Ω并联为2 Ω，与前面的2 Ω分压得到6 V。","hints":["先认清两只并联电阻接在同一对节点上。"],"tag":"计算与单位"},{"id":"c2-f2","type":"number","prompt":"电源流出的电流","value":3,"unit":"A","explain":"总电阻2+2=4 Ω，电流12/4=3 A。","hints":[],"tag":"计算与单位"},{"id":"c2-f3","type":"number","prompt":"流过6 Ω支路的电流","value":1,"unit":"A","explain":"6/6=1 A。","hints":[],"tag":"计算与单位"},{"id":"c2-f4","type":"number","prompt":"流过3 Ω支路的电流","value":2,"unit":"A","explain":"6/3=2 A。","hints":[],"tag":"计算与单位"}],"solution":["R₂∥R₃=6×3/(6+3)=2 Ω，总电阻4 Ω，源电流3 A。","Uₐ=12−3×2=6 V；两并联支路电流分别1 A、2 A。","KCL：3=1+2；左侧回路KVL：12−3×2−6=0。"],"takeaways":["KCL看电流怎样分，KVL看沿回路电位怎样变化。","源模型、元件关系与守恒方程共同决定结果。"]}},{"id":"3","title":"电阻与电源等效变换","group":"直流分析","minutes":"45–65","prior":"已学一轮，可复习","prereq":"串并联、KCL/KVL及源模型。","goals":["按连接节点判断串并联","理解端口等效的边界","正确变换电压源与电流源"],"guides":["外部负载一样时，什么样的两个网络才叫等效？","两个电阻画在一上一下，就一定是并联吗？","电源变换后，电流源箭头应该朝哪里？"],"sections":[{"title":"等效是从端口看进去","body":"\u003cp>端口是网络与外部连接的两个端点。端口等效要求：外接相同负载时，两网络的端口电压和电流关系一致。内部元件的电流、功率不必一一相同。\u003c/p>\u003cp>因此，可以用简化网络计算负载，却不能用简化后某个“内部电阻”的功率冒充原网络里某个器件的损耗。这也是以后戴维南等效的基本想法。\u003c/p>","q":{"id":"c3-1","type":"choice","prompt":"两个网络端口等效，必然相同的是？","options":["相同负载下的端口电压、电流","每个内部元件的功率","内部支路数量"],"answer":0,"explain":"端口等效保留外部电压电流关系，内部不必相同。","hints":[],"tag":"端口等效"},"diagram":null,"widget":null},{"title":"串并联由节点关系决定","body":"\u003cp>串联支路通过相同电流，连接处没有其他分流路径，总电阻R=R₁+R₂。并联电阻连接在同一对节点之间，端电压相同，总电导相加。\u003c/p>\u003cdiv class=\"equation\">1/R\u003csub>并\u003c/sub> = 1/R₁ + 1/R₂；两只时 R\u003csub>并\u003c/sub> = R₁R₂/(R₁+R₂)\u003c/div>\u003cp>例如3 Ω与6 Ω并联为2 Ω，小于任一支路电阻。把R₁+R₂用于并联，或者仅凭图形远近判断连接，都会出错。\u003c/p>","q":{"id":"c3-2","type":"number","prompt":"3 Ω与6 Ω并联，等效电阻是多少？","value":2,"unit":"Ω","explain":"3×6/(3+6)=2 Ω。","hints":["并联先加电导，或使用两电阻并联式。"],"tag":"并联"},"diagram":null,"widget":null},{"title":"分压与分流的使用条件","body":"\u003cp>串联两电阻可按电阻比例分压：U₁=U·R₁/(R₁+R₂)。并联两电阻可按电导比例分流：i₁=I·R₂/(R₁+R₂)。小电阻支路分到较大电流。\u003c/p>\u003cp>公式来自KVL、KCL和欧姆定律，使用前必须确认真的串联或并联。如果分压中点接上负载，需要重新计算该处等效电阻，不能照搬空载分压结果。\u003c/p>","q":{"id":"c3-3","type":"number","prompt":"总电流3 A流入3 Ω与6 Ω并联网络，3 Ω支路电流是多少？","value":2,"unit":"A","explain":"i₃Ω=3×6/(3+6)=2 A。","hints":["小电阻支路分到更多电流。"],"tag":"分流"},"diagram":null,"widget":null},{"title":"电源变换保留端口关系","body":"\u003cp>理想电压源Uₛ串联电阻R，可以等效为电流源Iₛ=Uₛ/R并联同一个R。电流源箭头指向原电压源正端对应的端口。\u003c/p>\u003cdiv class=\"equation\">U\u003csub>端\u003c/sub> = Uₛ − i\u003csub>负载\u003c/sub>R；Iₛ = Uₛ/R\u003c/div>\u003cp>例如12 V串3 Ω，转换为4 A并3 Ω。只变理想源而不处理它的串/并电阻，不是这个变换。受控源也不能盲目删除控制变量，需保持或正确重新表达控制关系和端口关系。\u003c/p>","q":{"id":"c3-4","type":"number","prompt":"12 V电压源串联3 Ω，对应的并联电流源大小是多少？","value":4,"unit":"A","explain":"Iₛ=12/3=4 A，电阻仍为3 Ω。","hints":["不要把变换电流误当成接入负载后的负载电流。"],"tag":"电源变换"},"diagram":"sourceTransform","widget":null}],"finale":{"intro":"12 V理想电压源串联内阻3 Ω，向6 Ω负载供电。先用原电路求负载电压电流，再把供电部分变换为电流源网络核对。","diagram":"thevenin12","parts":[{"id":"c3-f1","type":"number","prompt":"原电路负载电流","value":1.3333333333333333,"unit":"A","explain":"12/(3+6)=4/3 A。","hints":[],"tag":"计算与单位"},{"id":"c3-f2","type":"number","prompt":"负载电压","value":8,"unit":"V","explain":"(4/3)×6=8 V。","hints":[],"tag":"计算与单位"},{"id":"c3-f3","type":"number","prompt":"变换后3 Ω与6 Ω并联的等效电阻","value":2,"unit":"Ω","explain":"3∥6=2 Ω。","hints":[],"tag":"计算与单位"},{"id":"c3-f4","type":"number","prompt":"变换后的负载电流","value":1.3333333333333333,"unit":"A","explain":"总源电流4 A按并联分流，负载电流4×3/(3+6)=4/3 A。","hints":[],"tag":"计算与单位"}],"solution":["原电路总电阻9 Ω，负载电流4/3 A，负载电压8 V。","供电部分变为4 A电流源并3 Ω。接入6 Ω后，总并联电阻2 Ω，所以端口电压4×2=8 V。","负载电流8/6=4/3 A，与原电路相同。电流源的4 A不是负载电流。"],"takeaways":["判断串并联看节点，不看外形。","等效保留端口行为，变换源电流不一定等于负载电流。"]}},{"id":"6","title":"节点法与网孔法","group":"直流分析","minutes":"60–80","prior":"核心已学，计算需巩固","prereq":"KCL/KVL、欧姆定律、联立方程。","goals":["用节点电压表示支路电流","处理参考节点电压源与超节点","区分网孔电流和实际支路电流"],"guides":["为什么选一个参考节点能减少未知量？","两节点之间有理想电压源时怎样写KCL？","共用电阻的电流为什么可能是两个网孔电流之差？"],"sections":[{"title":"节点法的未知量是电位","body":"\u003cp>先选一个节点作0 V参考点，其余节点电压都相对它定义。电阻连接a、b时，规定从a到b为正的电流是(Vₐ−Vᵦ)/R，不能写成R/(Vₐ−Vᵦ)。\u003c/p>\u003cdiv class=\"equation\">i\u003csub>a→b\u003c/sub> = (V\u003csub>a\u003c/sub> − V\u003csub>b\u003c/sub>)/R\u003c/div>\u003cp>对未知节点写KCL，再代入电阻关系。比如a经2 Ω接已知10 V节点、经3 Ω接地： (Vₐ−10)/2+Vₐ/3=0。方程每一项都是电流。\u003c/p>","q":{"id":"c6-1","type":"number","prompt":"a为6 V，b为2 V，之间电阻2 Ω。从a到b的电流是多少？","value":2,"unit":"A","explain":"(6−2)/2=2 A。","hints":[],"tag":"节点电流"},"diagram":null,"widget":null},{"title":"自导、互导来自展开KCL","body":"\u003cp>a经R₁接地、经R₂连接b时，KCL展开为(1/R₁+1/R₂)Vₐ−(1/R₂)Vᵦ=注入a的源电流。自己的电位系数是相连电导之和，邻接节点项出现负电导。\u003c/p>\u003cp>这不是另外一条物理定律，而是把各支路(Vₐ−V邻)/R整理后的结果。记不清符号时，回到逐支路KCL比死背矩阵更可靠。\u003c/p>","q":{"id":"c6-2","type":"choice","prompt":"节点方程中−Vᵦ/R项主要来自？","options":["连接a、b电阻上的(Vₐ−Vᵦ)/R","所有节点电压必须为正","电流不能反向"],"answer":0,"explain":"负号来自两端电位相减。","hints":[],"tag":"节点方程符号"},"diagram":null,"widget":null},{"title":"理想电压源与超节点","body":"\u003cp>若理想电压源一端接参考点，它另一端电压可直接由极性确定。若两个未知节点a、b之间接电压源，则将两点及电源视为超节点，对边界外支路写总KCL，再补电压约束Vₐ−Vᵦ=Uₛ。\u003c/p>\u003cp>内部电压源电流在把两个节点KCL相加时抵消，所以不用先求它。超节点不能代替电压源约束；两条信息缺一不可。\u003c/p>","q":{"id":"c6-3","type":"number","prompt":"电压源正端接地、负端接a，源值12 V。Vₐ是多少？","value":-12,"unit":"V","explain":"0−Vₐ=12，所以Vₐ=−12 V。","hints":["电压源约束的是正端电位减负端电位。"],"tag":"电源极性"},"diagram":null,"widget":null},{"title":"网孔法用KVL组织未知量","body":"\u003cp>对于平面电路，可给各小网孔假设绕行电流。若相邻网孔都选顺时针，在共用电阻中方向相反，支路电流要按指定方向写为I₁−I₂或I₂−I₁。网孔电流是辅助未知量，不总等于某条支路电流。\u003c/p>\u003cp>例如网孔方程4I₁−2I₂=6、−2I₁+6I₂=0，解得I₁=1.8 A、I₂=0.6 A，共用2 Ω电阻向下电流1.2 A。方程各项单位为V。\u003c/p>","q":{"id":"c6-4","type":"number","prompt":"I₁=1.8 A向下通过共用支路，I₂=0.6 A向上。支路向下参考电流是多少？","value":1.2,"unit":"A","explain":"i=I₁−I₂=1.2 A。","hints":[],"tag":"网孔与支路"},"diagram":null,"widget":null},{"title":"先选方法，再回代","body":"\u003cp>未知节点少时节点法可能更省；网孔少时网孔法也可能方便。两者都依赖电路守恒关系，并结合元件关系。不要认为只能用一种方法。\u003c/p>\u003cp>本题如果你列对方程但算错，首先把数值代回原方程。若5I₁−3I₂=10，而你代入得到4.8，就能立刻知道求解有偏差。计算器可以帮算数，不能替你决定方程。\u003c/p>","q":{"id":"c6-5","type":"choice","prompt":"节点法与网孔法主要分别依据？","options":["KCL与KVL","都只用欧姆定律","功率定律与分压公式"],"answer":0,"explain":"节点法主要组织KCL，网孔法主要组织KVL，欧姆定律连接电压电流。","hints":[],"tag":"方法依据"},"diagram":null,"widget":null}],"finale":{"intro":"10 V源正端为c，负端接地。2 Ω接c—a；3 Ω接a—b；6 Ω接a—地；另一个3 Ω接b—地。取a、b对地电压为未知量，求节点电压与支路电流。","diagram":"twoNodes","parts":[{"id":"c6-f1","type":"number","prompt":"节点a电压","value":6,"unit":"V","explain":"由3Vₐ−Vᵦ=15、2Vᵦ−Vₐ=0得到Vₐ=6 V。","hints":["a节点：(Vₐ−10)/2+(Vₐ−Vᵦ)/3+Vₐ/6=0。","b节点：(Vᵦ−Vₐ)/3+Vᵦ/3=0。"],"tag":"计算与单位"},{"id":"c6-f2","type":"number","prompt":"节点b电压","value":3,"unit":"V","explain":"由2Vᵦ=Vₐ得到Vᵦ=3 V。","hints":[],"tag":"计算与单位"},{"id":"c6-f3","type":"number","prompt":"从c流向a的电流","value":2,"unit":"A","explain":"(10−6)/2=2 A。","hints":[],"tag":"计算与单位"},{"id":"c6-f4","type":"number","prompt":"从a流向b的电流","value":1,"unit":"A","explain":"(6−3)/3=1 A。","hints":[],"tag":"计算与单位"}],"solution":["a节点KCL乘6：3(Vₐ−10)+2(Vₐ−Vᵦ)+Vₐ=0，得到3Vₐ−Vᵦ=15。","b节点KCL：2Vᵦ−Vₐ=0。联立得到Vₐ=6 V、Vᵦ=3 V。","a流向地的6 Ω电流1 A，流向b为1 A，来自c为2 A，KCL：2=1+1。b经3 Ω流向地也是1 A。"],"takeaways":["电流表达式先定方向，再减电位。","列式正确和算式正确分别检查；回代能定位计算问题。"]}},{"id":"7","title":"叠加定理与戴维南","group":"直流分析","minutes":"60–85","prior":"当前进度：讲末综合题","prereq":"KCL、串并联、节点法和端口等效。","goals":["正确处理独立源置零和受控源","统一方向叠加电压电流","求出戴维南参数并分析负载变化"],"guides":["多个源共同作用时，怎样分开计算再合起来？","电源置零究竟把哪个物理量设成零？","负载改变时，怎样避免重新分析整个内部网络？"],"sections":[{"title":"置零的是源值","body":"\u003cp>理想独立电压源置零，要求它两端u=0，因此用短路替换；理想独立电流源置零，要求i=0，因此用开路替换。短路仍可能有电流，开路仍可能有电压。\u003c/p>\u003cp>叠加中每次保留一个独立源，其余独立源置零；电阻保留，受控源及控制关系也保留。受控源不属于可以随便关掉的独立激励。\u003c/p>","q":{"id":"c7-1","type":"choice","prompt":"让一个独立电压源单独作用时，其余理想独立电流源应怎样处理？","options":["开路","短路","与电阻一起删除"],"answer":0,"explain":"电流源置零要求支路电流为0，所以开路。","hints":["先问置零的是电压还是电流。"],"tag":"源置零"},"diagram":null,"widget":null},{"title":"叠加必须统一参考方向","body":"\u003cp>线性电路中，分响应可以代数相加。假设同一支路都规定向下为正，两个源单独作用分别产生0.8 A和−0.3 A，总电流为0.5 A。不能把负值先取绝对值。\u003c/p>\u003cp>对电压也是如此：统一Uₐᵦ=Vₐ−Vᵦ。即使某个分电路中支路电流换了方向，端口电压仍可能为正；要分别看所求量的定义，不能由“电流反向”直接判“电压为负”。\u003c/p>\u003cdiv class=\"equation\">i = i₁ + i₂；U\u003csub>ab\u003c/sub> = U\u003csub>ab,1\u003c/sub> + U\u003csub>ab,2\u003c/sub>\u003c/div>","q":{"id":"c7-2","type":"number","prompt":"同一向下参考方向的两个分电流为0.8 A、−0.3 A，总电流是多少？","value":0.5,"unit":"A","explain":"0.8+(−0.3)=0.5 A，实际向下。","hints":["保留负号作代数加法。"],"tag":"叠加方向"},"diagram":null,"widget":null},{"title":"功率重新根据总响应计算","body":"\u003cp>电阻功率是i²R。若i=i₁+i₂，则(i₁+i₂)²中存在2i₁i₂交叉项，所以不能把分电路功率直接相加。\u003c/p>\u003cp>例如6 Ω电阻的分电流分别1 A与0.25 A，总电流1.25 A，实际功率9.375 W；6 W与0.375 W的直接和只有6.375 W。先求总电流，再算真实功率。\u003c/p>","q":{"id":"c7-3","type":"number","prompt":"6 Ω电阻的分电流为+0.5 A和−0.5 A，两源共同作用时功率是多少？","value":0,"unit":"W","explain":"总电流为0，因此功率为0 W。分电路功率不能直接相加。","hints":["先求总电流。"],"tag":"功率叠加"},"diagram":null,"widget":null},{"title":"戴维南等效：两个参数概括端口","body":"\u003cp>对满足条件的线性含源二端电阻网络，负载端口可以用电压源UTh串电阻RTh表示。负载接回后，端口电压电流与原网络一致，内部损耗不保证一样。\u003c/p>\u003cp>先取下负载，保留供电网络内部支路和正常源，求开路电压Uoc，它就是UTh。取下负载不意味着内部电路处处没有电流。\u003c/p>\u003cdiv class=\"equation\">U\u003csub>Th\u003c/sub> = U\u003csub>oc\u003c/sub>；i\u003csub>L\u003c/sub> = U\u003csub>Th\u003c/sub>/(R\u003csub>Th\u003c/sub> + R\u003csub>L\u003c/sub>)\u003c/div>","q":{"id":"c7-4","type":"choice","prompt":"求开路电压时，正确操作是？","options":["取下负载，原供电网络的源正常保留","所有独立源同时置零","连同内部电阻一起去掉"],"answer":0,"explain":"开路是负载端口不输出电流，内部仍保留原激励。","hints":[],"tag":"开路电压"},"diagram":"thevenin10","widget":"load"},{"title":"求等效电阻，再检查负载结果","body":"\u003cp>对于仅含独立源和电阻的网络，取下负载，将所有独立源同时置零，从端口计算等效电阻。含受控源时保留受控源，必要时接测试源，用端口电压/电流求RTh。\u003c/p>\u003cp>此前双电压源练习得到UTh=10 V、RTh=2 Ω。RL从6 Ω变3 Ω时，i从1.25 A变2 A，UL从7.5 V变6 V。负载电流增加，内部等效电阻压降也增加，所以开路10 V不保证带载仍10 V。\u003c/p>","q":{"id":"c7-5","type":"number","prompt":"UTh=10 V，RTh=2 Ω，RL=3 Ω，负载电压是多少？","value":6,"unit":"V","explain":"i=10/(2+3)=2 A，UL=2×3=6 V。","hints":["接回负载后，两个电阻串联分压。"],"tag":"负载效应"},"diagram":null,"widget":null}],"finale":{"intro":"接着你在对话中尚未提交的讲末题：12 V源上正下负，经R₁=3 Ω接a；a经内部R₂=6 Ω接b；1 A理想电流源从a流向b；负载RL=6 Ω也接a、b，b=0 V。规定负载电流向下为正、UL=Vₐ−Vᵦ。先自己完整尝试，再逐步查看提示。","diagram":"capstone7","parts":[{"id":"c7-f1","type":"number","prompt":"仅12 V源作用时的负载分电流","value":1,"unit":"A","explain":"电流源开路，R₂∥RL=3 Ω，Va=6 V，所以iL₁=1 A。","hints":["电流源置零后开路；内部R₂仍保留。","先算6 Ω∥6 Ω，再分压。"],"tag":"源置零"},{"id":"c7-f2","type":"number","prompt":"仅1 A向下电流源作用时的负载分电流（向下为正）","value":-0.25,"unit":"A","explain":"电压源短路，a对地有3、6、6 Ω三支路，总电导2/3 S。Va=−1/(2/3)=−1.5 V，iL₂=−1.5/6=−0.25 A。","hints":["电压源短路后，三个电阻都从a接地。","KCL写Va/3+Va/6+Va/6+1=0。"],"tag":"叠加方向"},{"id":"c7-f3","type":"number","prompt":"接RL=6 Ω时的总负载电流","value":0.75,"unit":"A","explain":"iL=1+(−0.25)=0.75 A。","hints":[],"tag":"计算与单位"},{"id":"c7-f4","type":"number","prompt":"只取下RL后的开路电压Uoc","value":6,"unit":"V","explain":"(Va−12)/3+Va/6+1=0，得到Va=6 V。","hints":["内部R₂=6 Ω不能取下。","本题改为向下电流源，不能套用之前双电压源题的10 V。"],"tag":"开路电压"},{"id":"c7-f5","type":"number","prompt":"戴维南等效电阻RTh","value":2,"unit":"Ω","explain":"电压源短路、电流源开路，留下3 Ω∥6 Ω=2 Ω。","hints":[],"tag":"等效电阻"},{"id":"c7-f6","type":"number","prompt":"RL=6 Ω时负载实际功率","value":3.375,"unit":"W","explain":"iL=6/(2+6)=0.75 A，UL=4.5 V，PL=0.75²×6=3.375 W。","hints":["用总电流求功率。"],"tag":"功率叠加"},{"id":"c7-f7","type":"number","prompt":"RL改为2 Ω后的负载电压","value":3,"unit":"V","explain":"iL=6/(2+2)=1.5 A，UL=1.5×2=3 V。","hints":[],"tag":"负载效应"}],"solution":["叠加：电压源单独作用时Va=6 V，iL₁=1 A；电流源单独作用时Va=−1.5 V，iL₂=−0.25 A。总iL=0.75 A。","开路时只取下RL，保留R₂。KCL：(Va−12)/3+Va/6+1=0，所以Uoc=6 V。","所有独立源置零后RTh=3∥6=2 Ω。接回6 Ω，iL=6/8=0.75 A、UL=4.5 V，和叠加结果一致。","负载功率PL=0.75²×6=3.375 W。换RL=2 Ω后iL=1.5 A、UL=3 V。","原网络带RL=6 Ω时源流出(12−4.5)/3=2.5 A；内部电阻0.75 A、负载0.75 A和向下源1 A相加为2.5 A，KCL再次成立。"],"takeaways":["每个分响应都保持同一个参考方向。","取下负载、独立源置零是两种不同操作。","总电流、戴维南结果和KCL应彼此吻合。"]}},{"id":"9","title":"电容、电感与储能","group":"储能与暂态","minutes":"45–70","prior":"计划待学","prereq":"电压、电流、功率及基本导数直观概念。","goals":["把元件关系与储能机制联系起来","识别初始状态与稳态的不同","理解电压电流连续性的条件"],"guides":["电容为什么能暂时保存电能？","电容两端电压为什么通常不能突然变？","电感为什么会影响电流变化，而不仅仅影响电流大小？"],"sections":[{"title":"电容把状态存在电场里","body":"\u003cp>电容两极板间建立电场，电荷与两端电压满足q=Cu。C的单位是F，常用μF。关联参考方向下，i=C·du/dt：电流改变电荷积累，也就改变电压。\u003c/p>\u003cp>这说明电容电流和“电压变化速度”有关。电压保持不变时，理想电容电流为零；电压随时间增加时，在关联方向下电流为正。不是电压一大就一定有很大电流。\u003c/p>\u003cdiv class=\"equation\">q = Cu；i = C·du/dt；W\u003csub>C\u003c/sub> = ½Cu²\u003c/div>","q":{"id":"c9-1","type":"number","prompt":"100 μF电容两端电压10 V，储能是多少？","value":5,"unit":"mJ","explain":"W=0.5×100×10⁻⁶×10²=0.005 J=5 mJ。","hints":["把μF换成F；电压要平方。"],"tag":"储能与单位"},"diagram":null,"widget":null},{"title":"电感把状态存在磁场里","body":"\u003cp>线圈电流建立磁场。理想线性电感在关联参考方向下u=L·di/dt，L单位是H，常用mH。电流变化越快，所需电压越大；维持恒定电流时理想电感电压为零。\u003c/p>\u003cp>电感储能W=½Li²。实际线圈还有电阻、铁损、饱和和寄生参数，理想电感只是分析起点。断开感性电流的路径时，可能产生很高的电压，后续功率电路会学习续流和钳位。\u003c/p>\u003cdiv class=\"equation\">u = L·di/dt；W\u003csub>L\u003c/sub> = ½Li²\u003c/div>","q":{"id":"c9-2","type":"number","prompt":"50 mH电感通过2 A电流，储能是多少？","value":100,"unit":"mJ","explain":"W=0.5×0.05×2²=0.1 J=100 mJ。","hints":[],"tag":"储能与单位"},"diagram":null,"widget":null},{"title":"连续的是状态，条件要讲清","body":"\u003cp>由i=C·du/dt可知，在电流有限、没有冲激电流的普通换路情形中，电容电压不能突变：uC(0⁺)=uC(0⁻)。类似地，在电压有限、没有冲激电压时，电感电流不能突变。\u003c/p>\u003cp>电容电流、电感电压可以在换路后改变。不要把“状态通常连续”误读成“所有电压、电流都不能变”。若理想模型强制不相容的瞬时跳变，意味着需要考虑冲激或更真实的寄生模型，不能盲套简单结论。\u003c/p>","q":{"id":"c9-3","type":"choice","prompt":"普通有限激励换路中，通常连续的两个状态量是？","options":["电容电压和电感电流","电容电流和电感电压","所有元件电压和电流"],"answer":0,"explain":"电场和磁场状态对应的量，在上述条件下连续。","hints":["分别从i=Cdu/dt、u=Ldi/dt看突变需要什么。"],"tag":"换路连续性"},"diagram":null,"widget":null},{"title":"直流稳态和刚换路时分别处理","body":"\u003cp>在已经达到有限直流稳态的电路中，duC/dt=0，理想电容可视为开路；diL/dt=0，理想电感可视为短路。这个“直流稳态”前提不能省掉。\u003c/p>\u003cp>刚换路时，先找换路前的状态，再保留uC(0⁺)或iL(0⁺)。例如原本充到6 V的电容，不能在换路瞬间就当成0 V短路。理想电感直接跨恒压源可能持续爬升电流，也就不存在有限直流稳态。\u003c/p>","q":{"id":"c9-4","type":"choice","prompt":"已充到6 V的电容经电阻开始放电，普通换路后瞬间uC(0⁺)为？","options":["6 V","0 V","由电阻大小立即决定"],"answer":0,"explain":"电容原有电压在有限电流换路瞬间连续。","hints":[],"tag":"初始状态"},"diagram":null,"widget":null}],"finale":{"intro":"分别分析三个独立情形：①220 μF电容充到6 V；②100 mH理想电感通过0.5 A；③12 V源经6 Ω电阻与理想电感串联，已经达到直流稳态。","diagram":null,"parts":[{"id":"c9-f1","type":"number","prompt":"情形①电容的电荷量","value":1.32,"unit":"mC","explain":"q=220×10⁻⁶×6=0.00132 C=1.32 mC。","hints":[],"tag":"计算与单位"},{"id":"c9-f2","type":"number","prompt":"情形①电容储能","value":3.96,"unit":"mJ","explain":"0.5×220×10⁻⁶×6²=0.00396 J。","hints":[],"tag":"计算与单位"},{"id":"c9-f3","type":"number","prompt":"情形②电感储能","value":12.5,"unit":"mJ","explain":"0.5×0.1×0.5²=0.0125 J。","hints":[],"tag":"计算与单位"},{"id":"c9-f4","type":"number","prompt":"情形③稳态电流","value":2,"unit":"A","explain":"已达到稳态，理想电感压降为0，电流12/6=2 A。","hints":[],"tag":"计算与单位"}],"solution":["电容电荷q=Cu=1.32 mC，能量W=½Cu²=3.96 mJ。","电感能量W=½Li²=12.5 mJ。能量单位是J，不是W。","串联RL达到直流稳态后，电感相当于理想短路，电阻承受12 V，电流2 A；实际线圈电阻会改变这个结果。"],"takeaways":["电容关注电压及其变化，电感关注电流及其变化。","先分清刚换路和已稳态，再决定采用什么等效。"]}},{"id":"10","title":"一阶电路与时间常数","group":"储能与暂态","minutes":"60–80","prior":"计划待学","prereq":"电容电感的状态关系，指数函数的基本意义。","goals":["用初值、终值、时间常数写响应","解释电容电压和电感电流随时间变化","用波形核对快慢与极限"],"guides":["为什么充电初期快、后期慢？","时间常数改变的是最终电压，还是变化快慢？","带着初始电压接到新电源，怎样统一计算？"],"sections":[{"title":"先把一阶响应想成趋近过程","body":"\u003cp>含一个独立储能状态的线性电路，在普通条件下会以指数方式接近新的稳态。对于稳定的一阶过程，把状态记作x，它从初始x(0⁺)向终值x(∞)变化。\u003c/p>\u003cdiv class=\"equation\">x(t) = x(∞) + [x(0⁺) − x(∞)]e\u003csup>−t/τ\u003c/sup>\u003c/div>\u003cp>t=0时指数为1，公式回到初值；t趋大指数趋0，公式回到终值。用这两个极限检查，比仅背“充电式”“放电式”更可靠。\u003c/p>","q":{"id":"c10-1","type":"choice","prompt":"通用式中t=0时，应得到？","options":["x(0⁺)","x(∞)","0"],"answer":0,"explain":"把e⁰=1代入，初值必须恢复。","hints":[],"tag":"响应极限"},"diagram":null,"widget":null},{"title":"RC：找初值、终值和电阻","body":"\u003cp>RC电路的时间常数τ=R等效C。求R等效时，要从电容端看进去，在正确保留受控源关系的前提下处理供电网络。先用简单电阻网络练习。\u003c/p>\u003cp>例如12 V通过2 kΩ给100 μF未充电电容充电：τ=0.2 s，初值0、终值12 V，所以uC=12(1−e^(−t/0.2))。t=τ时达到终值变化量的约63.2%。\u003c/p>\u003cdiv class=\"equation\">τ\u003csub>RC\u003c/sub> = R\u003csub>等效\u003c/sub>C\u003c/div>","q":{"id":"c10-2","type":"number","prompt":"R=2 kΩ，C=100 μF，时间常数是多少？","value":0.2,"unit":"s","explain":"2000×100×10⁻⁶=0.2 s。","hints":["kΩ与μF的前缀都要换算。"],"tag":"时间常数"},"diagram":"rc","widget":"rc"},{"title":"电压趋近时，电流怎样变化","body":"\u003cp>电阻电流可由i=(Us−uC)/R求。未充电电容刚接入时，电流为Us/R；随着电容电压上升，电阻压降减小，电流逐渐接近0。理想直流电源仍维持电压，但稳态电容支路没有持续充电电流。\u003c/p>\u003cp>对12 V、2 kΩ、100 μF例子，i(0⁺)=6 mA；t=τ时i=6/e≈2.207 mA。若改变R，时间常数与初始电流都可能变；改变C时，理想最终电压仍由电路决定。\u003c/p>","q":{"id":"c10-3","type":"number","prompt":"12 V通过2 kΩ给未充电电容充电，初始电流是多少？","value":6,"unit":"mA","explain":"i(0⁺)=12/2000=0.006 A=6 mA。","hints":[],"tag":"初始电流"},"diagram":null,"widget":null},{"title":"RL用同样的三要素思路","body":"\u003cp>串联RL的状态通常选电感电流，τ=L/R等效。5 V经10 Ω给100 mH电感供电，初始电流0、终值0.5 A、τ=0.01 s。\u003c/p>\u003cdiv class=\"equation\">i\u003csub>L\u003c/sub>(t)=0.5(1−e\u003csup>−t/0.01\u003c/sup>) A；τ\u003csub>RL\u003c/sub>=L/R\u003csub>等效\u003c/sub>\u003c/div>\u003cp>电流初期变化快，电感电压较大；之后电流变化变慢，电感压降趋零。把电感当作一直开路或一直短路，都漏掉了变化过程。\u003c/p>","q":{"id":"c10-4","type":"number","prompt":"L=100 mH、R=10 Ω，RL时间常数是多少？","value":10,"unit":"ms","explain":"0.1/10=0.01 s=10 ms。","hints":[],"tag":"时间常数"},"diagram":null,"widget":null},{"title":"用几个时间点读波形","body":"\u003cp>距离终值的误差按e^(−t/τ)缩小：1τ剩36.8%，3τ剩约5%，5τ剩约0.674%。所谓“5τ基本结束”是工程近似，数学上指数并未突然变零。\u003c/p>\u003cp>对任意初值，缩小的是“初值与终值之差”。如果初值4 V、终值10 V，t=τ时不能直接算10×63.2%，应算10+(4−10)/e。\u003c/p>","q":{"id":"c10-5","type":"choice","prompt":"初值4 V、终值10 V，t=τ时应使用？","options":["10+(4−10)/e","10×63.2%","4+10"],"answer":0,"explain":"指数衰减的是状态与终值之间的差。","hints":[],"tag":"非零初值"},"diagram":null,"widget":null}],"finale":{"intro":"电容原本为4 V。在t=0通过1 kΩ接到10 V理想直流源，C=200 μF。换路后只有这个一阶充电回路，电压电流有限。","diagram":"rcInitial","parts":[{"id":"c10-f1","type":"number","prompt":"换路瞬间uC(0⁺)","value":4,"unit":"V","explain":"电容电压连续，仍为4 V。","hints":[],"tag":"计算与单位"},{"id":"c10-f2","type":"number","prompt":"时间常数τ","value":0.2,"unit":"s","explain":"1000×200×10⁻⁶=0.2 s。","hints":[],"tag":"计算与单位"},{"id":"c10-f3","type":"number","prompt":"最终电压uC(∞)","value":10,"unit":"V","explain":"稳态电流为0，电阻无压降，电容为10 V。","hints":[],"tag":"计算与单位"},{"id":"c10-f4","type":"number","prompt":"t=0.2 s时电容电压","value":7.792723352971346,"unit":"V","explain":"uC=10−6/e≈7.793 V。","hints":["用初值4、终值10，不能按零初值处理。"],"tag":"非零初值"},{"id":"c10-f5","type":"number","prompt":"换路瞬间电流","value":6,"unit":"mA","explain":"(10−4)/1000=6 mA。","hints":[],"tag":"计算与单位"}],"solution":["三要素：uC(0⁺)=4 V，uC(∞)=10 V，τ=0.2 s。","uC(t)=10−6e^(−t/0.2) V。电流i(t)=6e^(−t/0.2) mA。","t=0.2 s时uC≈7.793 V、i≈2.207 mA。t=0和t趋大分别回到4 V和10 V。","若只把R加倍，则τ加倍、初始电流减半，初值与终值在此理想电路中不变。"],"takeaways":["先求三要素，再写通用式。","用t=0、t趋大、单位和曲线趋势一起检查。"]}},{"id":"14","title":"正弦量、有效值与相量","group":"交流与三相","minutes":"55–75","prior":"计划待学","prereq":"三角函数、周期、复数的初步认识；本讲会补必要部分。","goals":["区分瞬时值、峰值和有效值","根据同频正弦量比较相位","把正弦稳态量转换成统一约定的相量"],"guides":["电压表读到的数值和正弦波峰值是什么关系？","两个电流峰值出现时间不同，怎样描述？","为什么交流问题可以转换成复数运算？"],"sections":[{"title":"用三个参数描述正弦波","body":"\u003cp>本学习包统一用余弦表示：u(t)=Um cos(ωt+φ)。Um为峰值，ω为角频率，φ为初相。周期T是重复一次的时间，频率f是每秒重复次数。\u003c/p>\u003cdiv class=\"equation\">T=1/f；ω=2πf\u003c/div>\u003cp>例如u=12√2 cos(100πt+30°) V，角频率100π rad/s，频率50 Hz，周期0.02 s。计算相位时，角度与弧度不能混用：30°=π/6 rad。\u003c/p>","q":{"id":"c14-1","type":"number","prompt":"ω=100π rad/s时，频率是多少？","value":50,"unit":"Hz","explain":"f=ω/(2π)=50 Hz。","hints":[],"tag":"频率与周期"},"diagram":null,"widget":null},{"title":"有效值描述等效发热能力","body":"\u003cp>有效值是平方的时间平均再开方，它使电阻上的平均发热与相应直流一致。纯正弦量U=Um/√2、I=Im/√2，这个√2关系不能随便套到任意波形。\u003c/p>\u003cp>上例峰值12√2 V、有效值12 V。交流电阻功率用有效值P=UI或I²R；如果把峰值直接当有效值，功率会算错一倍。\u003c/p>\u003cdiv class=\"equation\">正弦波：U=U\u003csub>m\u003c/sub>/√2\u003c/div>","q":{"id":"c14-2","type":"number","prompt":"正弦电压峰值为12√2 V，有效值是多少？","value":12,"unit":"V","explain":"正弦有效值=峰值/√2=12 V。","hints":[],"tag":"有效值"},"diagram":null,"widget":null},{"title":"相位只比较相同频率的量","body":"\u003cp>u=Um cos(ωt+φu)、i=Im cos(ωt+φi)，定义φ=φu−φi。φ&gt;0时电压相位超前电流，常说电流滞后。这里以相同的余弦参考和相同频率比较。\u003c/p>\u003cp>例如电压初相30°、电流初相−10°，相位差为40°。不要只比较某个瞬间谁的数值大；幅值也会影响瞬时值。正弦转余弦时，sinθ=cos(θ−90°)。\u003c/p>","q":{"id":"c14-3","type":"number","prompt":"电压初相30°、电流初相−10°，φu−φi是多少？","value":40,"unit":"deg","explain":"30−(−10)=40°。","hints":[],"tag":"相位差"},"diagram":null,"widget":"phase"},{"title":"相量保留幅值和初相","body":"\u003cp>对同频正弦稳态，公共时间因子可以暂时省去，用复数相量保存有效值和初相。本包写U̲=U∠φ，用有效值，不用峰值。直角形式为Ucosφ+jUsinφ，其中j²=−1。\u003c/p>\u003cp>例如3∠0°+4∠90°=3+j4=5∠53.13°。不能把两个有效值3和4直接加成7，因为它们的时间相位不同。瞬时值不是相量本身，最终需要时再还原波形。\u003c/p>\u003cdiv class=\"equation\">U̲ = U∠φ = U(cosφ + j sinφ)\u003c/div>","q":{"id":"c14-4","type":"number","prompt":"相量3∠0°与4∠90°相加，合相量的有效值是多少？","value":5,"unit":"V","explain":"|3+j4|=√(3²+4²)=5。","hints":["先转成实部和虚部相加。"],"tag":"相量相加"},"diagram":null,"widget":null}],"finale":{"intro":"已知u(t)=24√2 cos(200πt−30°) V，i(t)=2√2 cos(200πt−60°) A。两者使用相同的余弦参考，t的单位为秒。","diagram":null,"parts":[{"id":"c14-f1","type":"number","prompt":"电压有效值","value":24,"unit":"V","explain":"峰值24√2除以√2为24 V。","hints":[],"tag":"计算与单位"},{"id":"c14-f2","type":"number","prompt":"电流有效值","value":2,"unit":"A","explain":"峰值2√2除以√2为2 A。","hints":[],"tag":"计算与单位"},{"id":"c14-f3","type":"number","prompt":"频率","value":100,"unit":"Hz","explain":"200π/(2π)=100 Hz。","hints":[],"tag":"计算与单位"},{"id":"c14-f4","type":"number","prompt":"周期","value":10,"unit":"ms","explain":"1/100 s=0.01 s=10 ms。","hints":[],"tag":"计算与单位"},{"id":"c14-f5","type":"number","prompt":"φu−φi","value":30,"unit":"deg","explain":"−30−(−60)=30°，电压超前、电流滞后。","hints":[],"tag":"计算与单位"}],"solution":["有效值U=24 V、I=2 A；ω=200π rad/s，f=100 Hz，T=10 ms。","有效值相量U̲=24∠−30° V，I̲=2∠−60° A。","相位差为30°，表示电流相对电压滞后30°；它不是说电流大小一定比电压“小30”。"],"takeaways":["先统一余弦和有效值约定，再比较相位。","相量不是把瞬时电压电流变成普通实数。"]}},{"id":"15","title":"阻抗与相量法","group":"交流与三相","minutes":"60–80","prior":"计划待学","prereq":"正弦稳态、有效值相量、复数加减与极坐标。","goals":["把R/L/C关系写成阻抗","用相量欧姆定律计算","用相位和幅值检查电路行为"],"guides":["电感、电容为什么既影响电流大小也影响相位？","交流回路各电压有效值能直接相加吗？","频率变化时，哪些元件的阻抗会改变？"],"sections":[{"title":"阻抗把元件规律放进复数关系","body":"\u003cp>在同频正弦稳态中，采用关联参考方向，有U̲=ZI̲。电阻ZR=R；电感ZL=jωL；电容ZC=1/(jωC)=−j/(ωC)。阻抗单位仍是Ω，j表示90°的相位关系。\u003c/p>\u003cdiv class=\"equation\">Z\u003csub>R\u003c/sub>=R；Z\u003csub>L\u003c/sub>=jωL；Z\u003csub>C\u003c/sub>=−j/(ωC)\u003c/div>\u003cp>电感上电压超前电流90°，电容上电流超前电压90°。这些关系用于理想元件、正弦稳态；刚换路的暂态不能直接用一个定频阻抗取代全部分析。\u003c/p>","q":{"id":"c15-1","type":"choice","prompt":"理想电容的阻抗在本包相量约定下为？","options":["−j/(ωC)","jωC","R"],"answer":0,"explain":"1/j=−j，所以电容阻抗为负虚数。","hints":[],"tag":"阻抗符号"},"diagram":null,"widget":null},{"title":"串联先加阻抗，再求电流","body":"\u003cp>串联RLC的阻抗Z=R+j(XL−XC)，其中XL=ωL、XC=1/(ωC)都先取正的数值。正虚部表示整体感性，负虚部表示整体容性。\u003c/p>\u003cdiv class=\"equation\">|Z|=√[R²+(X\u003csub>L\u003c/sub>−X\u003csub>C\u003c/sub>)²]\u003c/div>\u003cp>例如R=6 Ω、XL=8 Ω、无电容，Z=6+j8=10∠53.13° Ω。20∠0° V加在其上，I̲=2∠−53.13° A。电流滞后，与感性判断一致。\u003c/p>","q":{"id":"c15-2","type":"number","prompt":"Z=6+j8 Ω，阻抗模是多少？","value":10,"unit":"Ω","explain":"√(6²+8²)=10 Ω。","hints":[],"tag":"复数模"},"diagram":"acSeries","widget":null},{"title":"KCL/KVL仍成立，但量是相量","body":"\u003cp>上例电流有效值2 A，电阻电压UR=12 V、电感电压UL=16 V；它们相位相差90°，源电压模为√(12²+16²)=20 V，而不是28 V。\u003c/p>\u003cp>串联阻抗相加，并联则可加导纳Y=1/Z。节点法和网孔法的结构仍能用，只是电压、电流与系数换成复数。求出复数电流后，再解释大小和方向关系。\u003c/p>","q":{"id":"c15-3","type":"number","prompt":"串联RL的UR=12 V、UL=16 V，正交相位下源电压有效值是多少？","value":20,"unit":"V","explain":"相量相加：√(12²+16²)=20 V。","hints":["电阻与理想电感电压相差90°。"],"tag":"交流电压相加"},"diagram":null,"widget":null},{"title":"频率改变会改变阻抗","body":"\u003cp>理想电感电抗XL与频率成正比；理想电容电抗XC与频率成反比。相同RLC在不同频率下，电流大小和相位可能不同。\u003c/p>\u003cp>先做三个检查：Ω与A相乘应得到V；整体感性时电流应滞后；串联时电流相同，电压按相量相加。高频下实际元件寄生参数可能使理想模型失效，后续项目需另核对。\u003c/p>","q":{"id":"c15-4","type":"choice","prompt":"理想电容C不变，频率加倍时其电抗大小怎样变化？","options":["减半","加倍","不变"],"answer":0,"explain":"XC=1/(2πfC)，f加倍则XC减半。","hints":[],"tag":"频率与电抗"},"diagram":null,"widget":null}],"finale":{"intro":"某串联RLC电路在给定频率下R=8 Ω、XL=10 Ω、XC=4 Ω。源电压有效值24 V，选源相量24∠0° V。","diagram":"rlc","parts":[{"id":"c15-f1","type":"number","prompt":"阻抗虚部对应的净电抗XL−XC","value":6,"unit":"Ω","explain":"10−4=6 Ω，整体感性。","hints":[],"tag":"计算与单位"},{"id":"c15-f2","type":"number","prompt":"阻抗模|Z|","value":10,"unit":"Ω","explain":"Z=8+j6，模√(64+36)=10 Ω。","hints":[],"tag":"计算与单位"},{"id":"c15-f3","type":"number","prompt":"电流有效值I","value":2.4,"unit":"A","explain":"24/10=2.4 A。","hints":[],"tag":"计算与单位"},{"id":"c15-f4","type":"number","prompt":"源电压相位减电流相位φ","value":36.86989764584402,"unit":"deg","explain":"φ=atan(6/8)=36.87°，电流滞后。","hints":["先从Z的实部、虚部确定阻抗角。"],"tag":"相位差"}],"solution":["Z=8+j(10−4)=8+j6=10∠36.87° Ω。","I̲=24∠0°/(10∠36.87°)=2.4∠−36.87° A。","UR=19.2 V、UL=24 V、UC=9.6 V。净无功方向电压14.4 V，源电压模√(19.2²+14.4²)=24 V。","不能把19.2+24+9.6当作源电压。整体感性，电流滞后36.87°，与判断相符。"],"takeaways":["交流方程保留守恒关系，但运算要遵守复数规则。","有效值的大小通常不能代替相量直接相加。"]}},{"id":"16","title":"交流功率与功率因数","group":"交流与三相","minutes":"55–75","prior":"计划待学","prereq":"有效值、阻抗、相位差及直流功率。","goals":["区分有功、无功和视在功率","根据负载相位判断Q的符号","解释功率因数补偿能改变什么"],"guides":["电压电流都很大，为什么有功功率可能不大？","无功功率是不是表示电能被白白消耗成热？","并联电容补偿后，负载本身的工作功率一定改变吗？"],"sections":[{"title":"瞬时功率有平均值，也有来回交换","body":"\u003cp>瞬时功率p(t)=u(t)i(t)。正弦稳态下，其一个周期的平均值是有功功率P=UIcosφ，U、I用有效值，φ=φu−φi。有功反映平均净能量转移，例如电阻发热。\u003c/p>\u003cp>电感和电容会在某些时段吸收能量、另一些时段返回能量，所以瞬时功率可能变号。理想纯电抗平均有功为零，但电流不一定为零，输电导线仍可能因该电流发热。\u003c/p>\u003cdiv class=\"equation\">P=UIcosφ　单位W\u003c/div>","q":{"id":"c16-1","type":"number","prompt":"U=20 V，I=2 A，cosφ=0.6，有功功率是多少？","value":24,"unit":"W","explain":"20×2×0.6=24 W。","hints":["U、I用有效值。"],"tag":"有功功率"},"diagram":null,"widget":null},{"title":"用P、Q、S描述不同侧面","body":"\u003cp>无功功率Q=UIsinφ，单位var；感性电流滞后时Q&gt;0，容性电流超前时Q&lt;0。视在功率S=UI，单位VA。正弦单相中S²=P²+Q²。\u003c/p>\u003cdiv class=\"equation\">Q=UIsinφ；S=UI；S²=P²+Q²\u003c/div>\u003cp>例如20 V、2 A、cosφ=0.6且滞后，sinφ=0.8，因此P=24 W、Q=32 var、S=40 VA。P与Q不是同一种单位，不能当普通实数直接相加为S。\u003c/p>","q":{"id":"c16-2","type":"number","prompt":"上述例子的视在功率是多少？","value":40,"unit":"VA","explain":"S=20×2=40 VA。","hints":[],"tag":"视在功率"},"diagram":null,"widget":null},{"title":"功率因数关系到电源和线路负担","body":"\u003cp>正弦情况下功率因数PF=P/S=cosφ。同样P、同样供电电压下，PF偏低意味着电源电流更大，线路I²R损耗、导线容量和电源容量需求可能增加。\u003c/p>\u003cp>例如100 V供电、P=400 W、PF=0.8，电源电流为400/(100×0.8)=5 A。若改善到PF=1且负载有功保持不变，电源电流为4 A。存在谐波时总功率因数不一定等于简单的cosφ，本讲先限定正弦。\u003c/p>","q":{"id":"c16-3","type":"number","prompt":"100 V、400 W、PF=0.8，电源电流是多少？","value":5,"unit":"A","explain":"I=P/(U·PF)=400/80=5 A。","hints":[],"tag":"功率因数"},"diagram":null,"widget":null},{"title":"并联补偿改变源侧无功需求","body":"\u003cp>在电压、频率近似恒定的理想正弦模型中，并联电容提供容性无功，可以抵消感性负载向电源索取的部分无功。原负载支路的电压和有功需求可基本不变，变化主要体现在源侧电流与无功。\u003c/p>\u003cdiv class=\"equation\">|Q\u003csub>C\u003c/sub>|=ωCU²；C=|Q\u003csub>C\u003c/sub>|/(ωU²)\u003c/div>\u003cp>补偿目标与实际设备约束需要具体设计，不能认为电容越多越好。本课程只做计算或仿真，不指导带电接入实际补偿装置。\u003c/p>","q":{"id":"c16-4","type":"choice","prompt":"理想条件下并联补偿后，首先应比较哪个电流来判断线路负担？","options":["电源总电流","只看原负载支路电流","只看电容电流"],"answer":0,"explain":"源电流是负载与电容电流的相量和。补偿主要降低源侧无功需求。","hints":[],"tag":"补偿边界"},"diagram":null,"widget":null}],"finale":{"intro":"单相正弦电源有效值100 V、50 Hz，某感性负载电流有效值5 A、功率因数0.8滞后。计算功率；再在理想模型中并联电容，使源侧功率因数达到1，假设负载有功不变。仅做纸笔或仿真。","diagram":null,"parts":[{"id":"c16-f1","type":"number","prompt":"视在功率S","value":500,"unit":"VA","explain":"100×5=500 VA。","hints":[],"tag":"计算与单位"},{"id":"c16-f2","type":"number","prompt":"有功功率P","value":400,"unit":"W","explain":"500×0.8=400 W。","hints":[],"tag":"计算与单位"},{"id":"c16-f3","type":"number","prompt":"负载无功功率Q","value":300,"unit":"var","explain":"sinφ=0.6，Q=500×0.6=300 var。","hints":["滞后负载Q取正。"],"tag":"无功符号"},{"id":"c16-f4","type":"number","prompt":"完全补偿后源侧电流","value":4,"unit":"A","explain":"源侧PF=1，I=P/U=400/100=4 A。","hints":[],"tag":"计算与单位"},{"id":"c16-f5","type":"number","prompt":"所需电容无功功率Q_C，保留符号","value":-300,"unit":"var","explain":"Qc=−300 var，用容性无功抵消原+300 var。","hints":[],"tag":"无功符号"},{"id":"c16-f6","type":"number","prompt":"电容C（理想计算）","value":95.49296585513719,"unit":"μF","explain":"C=300/(2π×50×100²)≈95.49 μF。","hints":["|Qc|=ωCU²，电压用有效值。"],"tag":"计算与单位"}],"solution":["S=500 VA，P=400 W，Q=+300 var，验证400²+300²=500²。","理想补偿到1需要Qc=−300 var，源侧Q为0，P仍400 W，源电流4 A。","C≈95.49 μF，电容支路电流大小3 A，与原负载电流作相量抵消。","负载本身仍可流过原5 A。实际补偿需要考虑谐波、投切、额定值和保护，不能把纸笔结果直接当施工方案。"],"takeaways":["P、Q、S分别对应W、var、VA。","补偿先明确假设和比较位置，不把源电流与负载支路电流混为一谈。"]}},{"id":"20","title":"对称三相电路","group":"交流与三相","minutes":"65–85","prior":"计划待学","prereq":"正弦量、相量、阻抗、单相交流功率。","goals":["在图上分清线量和相量","分析平衡星形与三角形负载","计算三相总功率并联系电机绕组电压"],"guides":["三相为什么相差120°而不是同时达到峰值？","星形和三角形中，每相负载承受的电压相同吗？","线电流与相电流什么时候相等、什么时候相差√3？"],"sections":[{"title":"先明确平衡与相序","body":"\u003cp>平衡三相电源的三相正弦电压，幅值相同、频率相同、相位依次相差120°。正相序ABC可写成Ua=U∠0°、Ub=U∠−120°、Uc=U∠120°。\u003c/p>\u003cp>若三相负载阻抗也相同，称对称负载。可以先分析一相，再利用相位关系得到另外两相。零线电流为零的结论要求相应的平衡条件；不能推广到任意不平衡或含谐波场景。\u003c/p>","q":{"id":"c20-1","type":"number","prompt":"平衡三相相邻相电压的相位差大小是多少？","value":120,"unit":"deg","explain":"三个相位在一周360°内均匀分布，每相差120°。","hints":[],"tag":"三相相位"},"diagram":null,"widget":null},{"title":"星形：每相接在线与中性点之间","body":"\u003cp>星形Y负载的三相一端连接为共同点n，另一端接A、B、C。每相电压是线到中性点电压，线电压是两条线之间电压。\u003c/p>\u003cdiv class=\"equation\">平衡Y：U\u003csub>线\u003c/sub>=√3 U\u003csub>相\u003c/sub>；I\u003csub>线\u003c/sub>=I\u003csub>相\u003c/sub>\u003c/div>\u003cp>因为Uab=Ua−Ub，两个相差120°的相量之差的模为√3U。正相序与相应方向下，Uab还比Ua超前30°。用线电压直接除相阻抗，会把星形电流多算√3。\u003c/p>","q":{"id":"c20-2","type":"number","prompt":"平衡星形负载线电压为120√3 V，每相电压是多少？","value":120,"unit":"V","explain":"U相=U线/√3=120 V。","hints":[],"tag":"线量与相量"},"diagram":"starDelta","widget":null},{"title":"三角形：每相直接跨两条线","body":"\u003cp>三角形Δ中，每相负载直接接在AB、BC、CA之间，因此U相=U线。线电流是该节点相邻两相支路电流的相量差，而非其中某一相电流。\u003c/p>\u003cdiv class=\"equation\">平衡Δ：U\u003csub>线\u003c/sub>=U\u003csub>相\u003c/sub>；I\u003csub>线\u003c/sub>=√3 I\u003csub>相\u003c/sub>\u003c/div>\u003cp>看到√3先问它连接的是哪两个量，不要把星形电压关系与三角形电流关系对调。相位30°关系也要配合相序和电流参考方向使用。\u003c/p>","q":{"id":"c20-3","type":"number","prompt":"平衡三角形负载每相电流2 A，线电流大小是多少？","value":3.4641016151377544,"unit":"A","explain":"I线=√3×2≈3.464 A。","hints":["三角形线电流是两相支路电流的相量差。"],"tag":"线量与相量"},"diagram":null,"widget":null},{"title":"三相功率是三个相功率之和","body":"\u003cp>平衡正弦三相负载总功率P=3U相I相cosφ=√3U线I线cosφ。类似地，Q=√3U线I线sinφ、S=√3U线I线。\u003c/p>\u003cdiv class=\"equation\">P\u003csub>三相\u003c/sub>=√3 U\u003csub>线\u003c/sub>I\u003csub>线\u003c/sub>cosφ\u003c/div>\u003cp>φ是每相负载电压与该相电流之差，也就是负载阻抗角。用线电压和线电流对应波形直接相减时，还可能混入连接关系的30°，不能不加判断地拿来当φ。\u003c/p>","q":{"id":"c20-4","type":"number","prompt":"平衡Y负载每相120 V、8 A、cosφ=0.8，总有功功率是多少？","value":2304,"unit":"W","explain":"3×120×8×0.8=2304 W。","hints":[],"tag":"三相功率"},"diagram":null,"widget":null},{"title":"绕组接法要满足额定电压","body":"\u003cp>同一线电压下，星形每相绕组承受U线/√3，三角形承受U线。把相同阻抗从Y改Δ，在同一电源和理想条件下，线电流及总功率会改变。\u003c/p>\u003cp>因此，电机不能仅凭“想功率更大”就随意改变接法，要根据铭牌、绕组额定电压、启动和保护要求判断。星三角启动还涉及互锁、切换和实际负载条件，后续电机与电气控制课程再详细学习。\u003c/p>","q":{"id":"c20-5","type":"choice","prompt":"同一线电压下，把相同绕组由Y改为Δ，每相绕组电压会怎样？","options":["变为原来的√3倍","变为原来的1/√3","不变"],"answer":0,"explain":"Y中U相=U线/√3，Δ中U相=U线。实际接法必须符合额定条件。","hints":[],"tag":"绕组电压"},"diagram":null,"widget":null}],"finale":{"intro":"平衡正相序三相电源，线电压有效值U线=120√3 V。每相负载阻抗Z=12+j9 Ω，接成星形，按理想对称正弦电路分析。","diagram":"star","parts":[{"id":"c20-f1","type":"number","prompt":"每相电压有效值","value":120,"unit":"V","explain":"星形U相=U线/√3=120 V。","hints":[],"tag":"计算与单位"},{"id":"c20-f2","type":"number","prompt":"每相阻抗模","value":15,"unit":"Ω","explain":"√(12²+9²)=15 Ω。","hints":[],"tag":"计算与单位"},{"id":"c20-f3","type":"number","prompt":"线电流有效值","value":8,"unit":"A","explain":"I相=120/15=8 A，Y中I线=I相。","hints":[],"tag":"计算与单位"},{"id":"c20-f4","type":"number","prompt":"功率因数","value":0.8,"unit":"1","explain":"cosφ=R/|Z|=12/15=0.8，整体感性滞后。","hints":[],"tag":"计算与单位"},{"id":"c20-f5","type":"number","prompt":"三相总有功功率","value":2304,"unit":"W","explain":"3×120×8×0.8=2304 W。","hints":[],"tag":"计算与单位"},{"id":"c20-f6","type":"number","prompt":"三相总无功功率","value":1728,"unit":"var","explain":"sinφ=9/15=0.6，Q=3×120×8×0.6=1728 var。","hints":[],"tag":"计算与单位"}],"solution":["星形每相120 V；Z=15∠36.87° Ω，每相电流8 A并滞后相电压36.87°。","I线=8 A；三相S=3×120×8=2880 VA；P=2304 W，Q=1728 var。","验证P²+Q²=S²，平衡下三相电流相量和为0。","如果相同阻抗在相同线电压下改接Δ，U相变为120√3 V、I相=8√3 A、I线=24 A、P=6912 W。这只是理想对比，不能据此随意改接真实电机。"],"takeaways":["先看接法，再分清所给与所求的线量、相量。","三相总功率可用三倍相功率核对√3线量公式。"]}}]}; const APP_STYLES="\n:root{--bg:#f3f6fa;--paper:#fff;--ink:#162e48;--text:#2b4057;--muted:#607286;--line:#d9e3ee;--blue:#1463db;--blue-light:#eaf2ff;--gold:#986310;--gold-light:#fff6df;--ok:#08785a;--ok-light:#eaf7f1;--bad:#b33c3c;--bad-light:#fff0ef;--radius:12px;font-family:\"Microsoft YaHei\",\"PingFang SC\",system-ui,sans-serif;color:var(--text);backgrou /* 原创SVG电路图。图形与节点连接用于教学，不是SPICE仿真网表。 */
const Figures = (() => {
  const line=(x1,y1,x2,y2)=>'<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'"/>';
  const text=(x,y,s,anchor='middle')=>'<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'">'+s+'</text>';
  const dot=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="currentColor"/>';
  const arrow=(x1,y1,x2,y2)=>{
    const a=Math.atan2(y2-y1,x2-x1),p=8;
    return '<g class="signal">'+line(x1,y1,x2,y2)+'<path d="M'+(x2-p*Math.cos(a-.5))+' '+(y2-p*Math.sin(a-.5))+' L'+x2+' '+y2+' L'+(x2-p*Math.cos(a+.5))+' '+(y2-p*Math.sin(a+.5))+'"/></g>';
  };
  const rh=(x1,x2,y,label)=>{const c=(x1+x2)/2;return line(x1,y,c-35,y)+'<rect x="'+(c-35)+'" y="'+(y-10)+'" width="70" height="20"/>'+line(c+35,y,x2,y)+text(c,y-22,label);};
  const rv=(x,y1,y2,label)=>{const c=(y1+y2)/2;return line(x,y1,x,c-30)+'<rect x="'+(x-10)+'" y="'+(c-30)+'" width="20" height="60"/>'+line(x,c+30,x,y2)+text(x+23,c+6,label,'start');};
  const vs=(x,y,label)=>'<circle cx="'+x+'" cy="'+y+'" r="25"/>'+text(x,y-4,'+')+text(x,y+18,'−')+text(x-38,y+6,label,'end');
  const ac=(x,y,label)=>'<circle cx="'+x+'" cy="'+y+'" r="25"/><path d="M'+(x-16)+' '+y+' q8 -20 16 0 q8 20 16 0"/>'+text(x-38,y+6,label,'end');
  const is=(x,y,label)=>'<circle cx="'+x+'" cy="'+y+'" r="25"/>'+arrow(x,y-14,x,y+14)+text(x+38,y+5,label,'start');
  const wrap=(body,caption,h=300)=>'<figure class="circuit"><svg viewBox="0 0 760 '+h+'" role="img" aria-label="'+caption+'"><title>'+caption+'</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+body+'</g></svg><figcaption>'+caption+'</figcaption></figure>';
  const sourceWires=(v='12 V')=>line(100,60,100,125)+vs(100,150,v)+line(100,175,100,250);
  const figs={};
  figs.power=()=>wrap(vs(330,155,'u = 6 V')+line(330,80,330,130)+line(330,180,330,245)+arrow(380,122,380,65)+text(402,90,'i = 2 A','start')+text(330,275,'电流从电压正端流出'),'本图使用非关联参考方向，吸收功率取 −ui。');
  figs.series12=()=>wrap(sourceWires()+rh(100,340,60,'R₁ = 2 Ω')+rh(340,650,60,'R₂ = 4 Ω')+line(650,60,650,250)+line(100,250,650,250)+arrow(320,105,385,105)+text(355,132,'i'),'12 V源与2 Ω、4 Ω串联，回路电流从电源正端流出。');
  figs.parallel12=()=>wrap(sourceWires()+rh(100,350,60,'R₁ = 2 Ω')+line(350,60,600,60)+rv(350,60,250,'R₂ = 6 Ω')+rv(600,60,250,'R₃ = 3 Ω')+line(100,250,600,250)+dot(350,60)+text(350,35,'a')+text(350,280,'0 V'),'节点a经6 Ω和3 Ω分别接地，两支路并联。');
  figs.twoNodes=()=>wrap(sourceWires('10 V')+rh(100,340,60,'2 Ω')+rh(340,610,60,'3 Ω')+rv(340,60,250,'6 Ω')+rv(610,60,250,'3 Ω')+line(100,250,610,250)+dot(340,60)+dot(610,60)+text(340,31,'a')+text(610,31,'b')+text(350,280,'参考节点：0 V'),'a、b为未知节点；左侧电压源上端是已知10 V节点。');
  const th=(u,r)=>wrap(sourceWires(u+' V')+rh(100,500,60,'RTh = '+r+' Ω')+dot(500,60)+text(500,35,'a')+rv(500,60,250,'RL = 6 Ω')+line(100,250,500,250)+dot(500,250)+text(500,280,'b')+arrow(610,95,610,160)+text(630,133,'iL','start'),'戴维南电压源串等效电阻，负载接在a、b端口。');
  figs.thevenin12=()=>th(12,3);

function parseValue(raw){
 const str=String(raw).trim().replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/√\s*\(/g,'sqrt(');
 if(!str||str.length>120)throw Error('请输入数值，支持分数和 sqrt(3) 等简单表达式。');
 const compact=str.replace(/\s+/g,'');
 const tok=compact.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|sqrt|pi|e|[()+*/^\-]/g)||[];
 if(tok.join('')!==compact)throw Error('请只输入数值或简单算式，单位在右侧选择。例如 4/3、2*sqrt(3)。');
 let i=0,depth=0;
 function atom(){
  if(++depth>25)throw Error('算式嵌套太深。');
  let v,t=tok[i++];
  if(t==='('){v=add();if(tok[i++]!==')')throw Error('请检查括号。');}
  else if(t==='sqrt'){if(tok[i++]!=='(')throw Error('请写成 sqrt(3)。');v=Math.sqrt(add());if(tok[i++]!==')')throw Error('请检查括号。');}
  else if(t==='pi')v=Math.PI;else if(t==='e')v=Math.E;
  else if(t!==undefined&&/^(?:\d|\.)/.test(t))v=Number(t);
  else throw Error('算式不完整，请检查运算符。');
  depth--;return v;
 }
 function power(){let v=atom();if(tok[i]==='^'){i++;v=Math.pow(v,unary());}return v;}
 function unary(){if(tok[i]==='+'||tok[i]==='-'){const op=tok[i++],v=unary();return op==='-'?-v:v;}return power();}
 function mul(){let v=unary();while(tok[i]==='*'||tok[i]==='/'){const op=tok[i++],x=unary();v=op==='*'?v*x:v/x;}return v;}
 function add(){let v=mul();while(tok[i]==='+'||tok[i]==='-'){const op=tok[i++],x=mul();v=op==='+'?v+x:v-x;}return v;}
 const value=add();
 if(i!==tok.length||!Number.isFinite(value))throw Error('算式无有效结果，请检查除数、根号和括号。');
 return value;
}
function grade(q,a){
 if(q.type==='choice'){
  if(a.choice===undefined||a.choice===null||a.choice==='')return {kind:'neutral',correct:null,message:'先选一个答案，再检查。'};
  const correct=Number(a.choice)===q.answer;
  return {kind:correct?'good':'bad',correct,message:correct?'判断正确。可以继续解释一下原因，再看提示或参考解析。':'这个判断还需要调整。先回到本节定义，再试一次；需要时展开提示。'};
 }
 let v;try{v=parseValue(a.raw);}catch(e){return {kind:'neutral',correct:null,message:e.message};}
 const got=UnitTable[a.unit],want=UnitTable[q.unit];
 if(!got)return {kind:'neutral',correct:null,message:'数值已经输入，再为它选择单位；无单位的数量选择“无量纲”。'};
 if(got[1]!==want[1])return {kind:'bad',correct:false,message:'单位需要调整：本题结果应属于 '+want[0]+' 对应的物理量，你选择了 '+got[0]+'。先区分电压、电流、电阻、功率等量。'};
 const actual=v*got[2],expected=q.value*want[2],tol=Math.max(Math.abs(expected)*.01,1e-8);
 if(Math.abs(actual-expected)<=tol)return {kind:'good',correct:true,message:'数值和单位正确。再用数量级、参考方向或极限情况检查一次。'};
 if(Math.abs(actual+expected)<=tol&&Math.abs(expected)>1e-8)return {kind:'bad',correct:false,message:'大小接近，但正负号相反。请核对题目规定的参考方向、电压极性或功率记法。'};
 const ratio=expected!==0?Math.abs(actual/expected):0;
 if([.000001,.001,1000,1000000].some(r=>Math.abs(ratio/r-1)<.015))return {kind:'bad',correct:false,message:'请重点检查单位前缀换算：k、m、μ分别表示10³、10⁻³、10⁻⁶。'};
 return {kind:'bad',correct:false,message:'结果还不一致。先检查连接关系和列式，再检查运算；可展开提示逐步定位。'};
}

 return out;
}

function plotSVG(lines,{xlabel='时间',ylabel='归一化值',xmax=5,ymin=0,ymax=1,ticks=[0,1,2,3,4,5]}={}){
 const w=660,h=230,left=55,right=23,top=20,bottom=43,pw=w-left-right,ph=h-top-bottom;
 const px=x=>left+x/xmax*pw,py=y=>top+(ymax-y)/(ymax-ymin)*ph;
 const grid=ticks.map(t=>'<path d="M'+px(t)+' '+top+' V'+(h-bottom)+'" stroke="#e2eaf3"/><text x="'+px(t)+'" y="'+(h-bottom+22)+'" text-anchor="middle">'+t+'</text>').join('');
 const paths=lines.map(l=>'<path d="'+l.points.map(([x,y],i)=>(i?'L':'M')+px(x).toFixed(2)+' '+py(y).toFixed(2)).join(' ')+'" fill="none" stroke="'+l.color+'" stroke-width="2.7"/>').join('');
 return '<svg class="plot" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(ylabel+'随'+xlabel+'变化的数学模型曲线')+'">'+grid+'<path d="M'+left+' '+top+' V'+(h-bottom)+' H'+(w-right)+'" stroke="#9eb1c9" fill="none"/>'+paths+'<text x="'+left+'" y="12">'+esc(ylabel)+'</text><text x="'+(w-right)+'" y="'+(h-3)+'" text-anchor="end">'+esc(xlabel)+'</text></svg>';
}
function updateWidget(node){
 const vals={};node.querySelectorAll('[data-param]').forEach(el=>{vals[el.dataset.param]=Number(el.value);node.querySelector('[data-output="'+el.dataset.param+'"]').textContent=el.value;});
 const kind=node.dataset.widget,read=node.querySelector('[data-readout]'),plot=node.querySelector('[data-plot]');
 if(kind==='rc'){
  const tau=vals.r*1000*vals.c*1e-6,u1=vals.u*(1-Math.exp(-1)),i0=vals.u/vals.r;
  read.innerHTML='<span>τ = <strong>'+tau.toFixed(3)+' s</strong></span><span>uC(τ) = <strong>'+u1.toFixed(2)+' V</strong></span><span>初始电流 = <strong>'+i0.toFixed(2)+' mA</strong></span>';
  plot.innerHTML=plotSVG([{color:'#1463db',points:Array.from({length:101},(_,i)=>[i/20,vals.u*(1-Math.exp(-i/20))])}],{xlabel:'时间 t / τ（横轴实际5τ = '+(5*tau).toFixed(3)+' s）',ylabel:'uC / V',ymax:vals.u});
 }else if(kind==='load'){
  const i=10/(2+vals.rl),u=i*vals.rl,p=i*i*vals.rl;
  read.innerHTML='<span>iL = <strong>'+i.toFixed(3)+' A</strong></span><span>UL = <strong>'+u.toFixed(3)+' V</strong></span><span>PL = <strong>'+p.toFixed(3)+' W</strong></span>';
  plot.innerHTML=plotSVG([{color:'#1463db',points:Array.from({length:101},(_,i)=>{const r=i/5;return [r,10*r/(2+r)];})}],{xlabel:'负载 RL / Ω',ylabel:'端口 UL / V',xmax:20,ymax:10,ticks:[0,4,8,12,16,20]});
 }else{
  const phi=vals.phase*Math.PI/180;
  read.innerHTML='<span>φu − φi = <strong>'+vals.phase+'°</strong></span><span><strong>'+(vals.phase>0?'电流滞后':vals.phase<0?'电流超前':'电压电流同相')+'</strong></span><span>蓝线：u；金线：i（均归一化）</span>';
  plot.innerHTML=plotSVG([{color:'#1463db',points:Array.from({length:161},(_,i)=>[i/80,Math.cos(i/80*2*Math.PI)])},{color:'#b97720',points:Array.from({length:161},(_,i)=>[i/80,Math.cos(i/80*2*Math.PI-phi)])}],{xlabel:'时间 t / T',ylabel:'归一化幅值',xmax:2,ymin:-1.2,ymax:1.2,ticks:[0,.5,1,1.5,2]});
 }
}
